  <!-- Explicit mission choice on a fresh session. Live feeds are not auto-enabled
       until the visitor asks; shared links skip this surface entirely. It returns
       every session until "Don't show this again" is ticked — see
       src/firstRunExperience.js for the full show policy. -->
  <aside id="first-run-launcher" role="dialog" aria-labelledby="first-run-title" aria-describedby="first-run-description" tabindex="-1" hidden>
    <div class="first-run-scanline" aria-hidden="true"></div>
    <header class="first-run-header">
      <span class="first-run-kicker">PANOPTES · MISSION SELECT</span>
    </header>
    <h2 id="first-run-title">Where do you want to look first?</h2>
    <!-- The card's one persuasive line, owner-authored and VERBATIM (2026-08-23)
         — including the unspaced em dash. The arc it has to carry: this looks
         like something you should not have access to → the sources are all
         public → the data is real. Tile subcopy stays purely functional. -->
    <p id="first-run-description">Every public signal on one globe: aircraft, ships, satellites, conflicts and strategic sites.</p>
    <div class="first-run-choices">
      <button type="button" data-first-run-choice="air-watch">
        <span class="material-symbols-outlined" aria-hidden="true">flight</span>
        <span><strong>AIR WATCH</strong><small>Live civil and military flights over Spain and Europe</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" data-first-run-choice="strategic">
        <span class="material-symbols-outlined" aria-hidden="true">military_tech</span>
        <span><strong>STRATEGIC MAP</strong><small>Military bases and nuclear sites across Europe</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" data-first-run-choice="maritime">
        <span class="material-symbols-outlined" aria-hidden="true">directions_boat</span>
        <span><strong>MARITIME TRAFFIC</strong><small>Live AIS ships, ports and the Strait of Gibraltar</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" data-first-run-choice="orbit">
        <span class="material-symbols-outlined" aria-hidden="true">satellite_alt</span>
        <span><strong>ORBIT</strong><small>Every tracked satellite around the globe</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" data-first-run-choice="live-events">
        <span class="material-symbols-outlined" aria-hidden="true">crisis_alert</span>
        <span><strong>LIVE EVENTS</strong><small>Conflicts, disaster alerts and earthquakes worldwide</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" class="first-run-explore" data-first-run-choice="explore">
        <span class="material-symbols-outlined" aria-hidden="true">travel_explore</span>
        <span><strong>EXPLORE FREELY</strong><small>A clean globe; pick your own layers</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
    </div>
    <div class="first-run-footer">
      <label class="first-run-suppress">
        <input type="checkbox" data-first-run-suppress />
        <span>Don't show this again</span>
      </label>
      <span>ESC to dismiss</span>
    </div>
    <!-- Kept out of the footer row: it swaps to mission progress and errors, and
         a live region that also holds layout makes the row jump as it speaks. -->
    <p class="first-run-note" data-first-run-status role="status" aria-live="polite">Tip: press Ctrl+K to search anything, or use the MIC button to talk to the globe.</p>
  </aside>
