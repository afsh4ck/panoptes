  <!-- IBM Plex is the interface typeface (docs/DESIGN-SYSTEM.md). JetBrains Mono
       stays loaded for canvas-drawn overlays that still name it directly. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,center_focus_strong,chevron_left,chevron_right,close,close_fullscreen,contrast,crisis_alert,dark_mode,dashboard,deblur,directions_boat,draw,east,flare,flight,fullscreen,layers_clear,light_mode,local_fire_department,military_tech,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,satellite_alt,skip_next,skip_previous,travel_explore,view_in_ar" rel="stylesheet" />
</head>
