<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">PANOPTES</title>
  <defs>
    <radialGradient id="iris" cx="40%" cy="36%" r="60%">
      <stop offset="0" stop-color="#fff1cc" />
      <stop offset="0.35" stop-color="#f5a524" />
      <stop offset="1" stop-color="#b86a0c" />
    </radialGradient>
    <!-- Central almond eye; the moving iris is clipped to it. -->
    <clipPath id="eye-clip">
      <path d="M14 32 Q32 18.5 50 32 Q32 45.5 14 32 Z" />
    </clipPath>
    <!-- One small watching eye, drawn eight times around the ring. -->
    <g id="watch">
      <path d="M-4.2 0 Q0 -3.1 4.2 0 Q0 3.1 -4.2 0 Z" fill="none" stroke="#f5a524" stroke-width="1" />
      <circle r="1.25" fill="#f5a524" />
    </g>
  </defs>
  <!-- The hundred eyes of Argus Panoptes: a ring of eight watchers. -->
  <g opacity="0.85">
    <use href="#watch" transform="translate(32 5.5)" />
    <use href="#watch" transform="translate(50.7 13.3) rotate(45)" />
    <use href="#watch" transform="translate(58.5 32) rotate(90)" />
    <use href="#watch" transform="translate(50.7 50.7) rotate(135)" />
    <use href="#watch" transform="translate(32 58.5)" />
    <use href="#watch" transform="translate(13.3 50.7) rotate(45)" />
    <use href="#watch" transform="translate(5.5 32) rotate(90)" />
    <use href="#watch" transform="translate(13.3 13.3) rotate(135)" />
  </g>
  <!-- Central eye outline: fixed. -->
  <path d="M14 32 Q32 18.5 50 32 Q32 45.5 14 32 Z" fill="#f5a524" fill-opacity="0.08" stroke="#f5a524" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Moving parts live in a 640-unit space (scaled 0.1) so the pointer gaze
       offset applied by src/logoGaze.js (up to 34 units) stays inside the eye;
       the clip keeps the iris within the lids. -->
  <g clip-path="url(#eye-clip)">
    <g transform="scale(0.1)">
      <g id="globe">
        <circle cx="320" cy="320" r="78" fill="url(#iris)" />
        <circle cx="320" cy="320" r="28" fill="#1a1005" />
        <circle cx="298" cy="294" r="11" fill="#fff7e6" fill-opacity="0.9" />
      </g>
      <g id="globe_cage" fill="none" stroke="#1a1005" stroke-opacity="0.3" stroke-width="5">
        <circle cx="320" cy="320" r="52" />
      </g>
    </g>
  </g>
</svg>
